# Config-as-code: overrides dashboard start command so deploys always use a
# long worker timeout (Railpack auto-detect often runs plain `gunicorn run:app`
# with the 30s default, causing agent-messages to 500 at ~30s).
# https://docs.railway.com/reference/config-as-code

[deploy]
startCommand = "gunicorn -c gunicorn.conf.py run:app"
