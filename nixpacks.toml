[phases.setup]
nixPkgs = ["nodejs-18_x", "python311"]

[providers]
nodejs = []
python = []

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = [
  "echo 🚀 STARTING FRONTEND BUILD",
  "cd frontend && npm ci && npm run build",
  "echo ✅ FRONTEND BUILD COMPLETE",
  "ls -la frontend/dist || echo ❌ DIST NOT FOUND"
]

[start]
cmd = "python -m gunicorn app:create_app\\(\\) --bind 0.0.0.0:$PORT --workers 1"
