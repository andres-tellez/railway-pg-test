name: Staging Strava Ingestion (Cron)

on:
  # Every 2 hours on the hour (UTC)
  schedule:
    - cron: "0 */2 * * *"
  # Allow manual runs
  workflow_dispatch:

jobs:
  staging-ingestion:
    # Hard gate from repository variable
    if: ${{ vars.RUN_STAGING_CRON == 'true' }}
    runs-on: ubuntu-latest
    environment: staging

    env:
      # Inject staging env **secrets**
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STRAVA_CLIENT_ID: ${{ vars.STAGING_STRAVA_CLIENT_ID }}   # non-secret -> env variable
      STRAVA_CLIENT_SECRET: ${{ secrets.STAGING_STRAVA_CLIENT_SECRET }}
      REDIRECT_URI: ${{ vars.STAGING_REDIRECT_URI }}
      INTERNAL_API_KEY: ${{ secrets.STAGING_INTERNAL_API_KEY }}
      CRON_SECRET_KEY: ${{ secrets.STAGING_CRON_SECRET_KEY }}
      PYTHONPATH: ${{ github.workspace }}/src
      RUN_STAGING_CRON: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Echo key envs (sanity check)
        run: |
          echo "Branch: $GITHUB_REF"
          echo "RUN_STAGING_CRON=$RUN_STAGING_CRON"
          echo "REDIRECT_URI=$REDIRECT_URI"
          python - << 'PY'
import os
print("DB present:", bool(os.getenv("DATABASE_URL")))
print("CLIENT_ID present:", bool(os.getenv("STRAVA_CLIENT_ID")))
print("CLIENT_SECRET present:", bool(os.getenv("STRAVA_CLIENT_SECRET")))
PY

      - name: (Optional) Debug token
        run: python -m src.scripts.debug_token || true

      - name: Run ingestion + enrichment (staging)
        run: python -m src.scripts.main_pipeline --all --lookback_days=1
