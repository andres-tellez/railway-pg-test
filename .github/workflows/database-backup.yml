# Postgres logical backup via pg_dump → GitHub Actions artifact (no B2/S3).
# Requires repository secret: DATABASE_URL (production Postgres URL reachable from GitHub runners).
name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *' # Daily 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL secret is not set (GitHub → Settings → Secrets → Actions)."
            exit 1
          fi
          mkdir -p backup-output
          python scripts/backup_database.py \
            --storage local \
            --local-path backup-output \
            --output-dir /tmp/pg_dump_workspace

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_number }}-${{ github.run_id }}
          path: backup-output/*.sql
          if-no-files-found: error
          retention-days: 90
