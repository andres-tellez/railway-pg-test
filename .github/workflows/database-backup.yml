# Postgres logical backup: pg_dump of **production** Postgres → GitHub Actions artifact (no B2/S3).
#
# The database being backed up is always **production** (e.g. Railway `db-prod`).
#
# Secrets (Actions):
#   - PRODUCTION_DATABASE_URL (recommended — makes “prod only” explicit)
#   - or DATABASE_URL as fallback if it is your **production** URL (never staging)
name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *' # Daily 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      # Single source for pg_dump: production only (explicit secret preferred).
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create production database backup
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Set PRODUCTION_DATABASE_URL (recommended) or DATABASE_URL to your **production** Postgres URL."
            echo "   GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          mkdir -p backup-output
          python scripts/backup_database.py \
            --storage local \
            --local-path backup-output \
            --output-dir /tmp/pg_dump_workspace

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-prod-${{ github.run_number }}-${{ github.run_id }}
          path: backup-output/*.sql
          if-no-files-found: error
          retention-days: 90
